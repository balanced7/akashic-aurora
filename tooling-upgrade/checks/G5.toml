# G5 -- tests, hooks, CI, dependency automation and docs. Registered in G0. Append-only.
goal = "G5"
required_drills = ["D10", "D11", "D15"]   # D13 joins only if PF5 hooks are installed

[[check]]
id = "G5.prek-all-files"
phase = "G5.P2"
cmd = ["uv", "run", "--frozen", "prek", "run", "--all-files"]
expect = 0
timeout_s = 3600

[[check]]
id = "G5.ci-lint"
phase = "G5.P3"
cmd = ["uv", "run", "--frozen", "poe", "ci-lint"]
expect = 0

[[check]]
id = "G5.ci-local-replay"
phase = "G5.P3"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-ci-replay"]
expect = 0
timeout_s = 7200

[[check]]
id = "G5.experiments-recorded"
phase = "G5.P1"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-ledger-entry", "G5.P1"]
expect = 0

[[check]]
id = "G5.docs-uv-primary"
phase = "G5.P4"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-docs-uv"]
expect = 0

[[check]]
id = "G5.oracle"
phase = "G5.P4"
cmd = ["{python}", "tooling-upgrade/oracle.py", "compare", "g0", "head"]
expect = 0
expect_stdout = "^ORACLE: 10/10 EQUAL$"
