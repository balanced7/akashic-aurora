# G5 -- tests, hooks, CI, dependency automation and docs. Registered in G0. Append-only.
goal = "G5"
required_drills = ["D10", "D11", "D15"]   # D13 joins only if PF5 hooks are installed

[[check]]
id = "G5.prek-all-files"
phase = "G5.P2"
cmd = ["uv", "run", "--frozen", "prek", "run", "--all-files"]
expect = 0
timeout_s = 3600

[[check]]
id = "G5.ci-lint"
phase = "G5.P3"
cmd = ["uv", "run", "--frozen", "poe", "ci-lint"]
expect = 0

[[check]]
id = "G5.ci-local-replay"
phase = "G5.P3"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-ci-replay"]
expect = 0
timeout_s = 7200

[[check]]
id = "G5.experiments-recorded"
phase = "G5.P1"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-ledger-entry", "G5.P1"]
expect = 0

[[check]]
id = "G5.docs-uv-primary"
phase = "G5.P4"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-docs-uv"]
expect = 0

[[check]]
id = "G5.oracle"
phase = "G5.P4"
cmd = ["{python}", "tooling-upgrade/oracle.py", "compare", "g0", "head"]
expect = 0
expect_stdout = "^ORACLE: 10/10 EQUAL$"

# ---- appended at G5 start (pre-registration, plan 9) ----

[[check]]
id = "G5.experiments-verdicts"
phase = "G5.P1"
# EXPERIMENTS-G5.md: one toml block per experiment (xdist, randomly, doctest, coverage) with an
# ADOPT/REJECT verdict and evidence; REJECTed randomly => -p no:randomly default + BACKLOG list.
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-experiments"]
expect = 0

[[check]]
id = "G5.precommit-config"
phase = "G5.P2"
# full-SHA revs with version comments, the plan's hook ids, exclude = ARCHIVAL,
# no whitespace/EOF fixers, and no prek-installed git hook (never `prek install`).
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-precommit-config"]
expect = 0

[[check]]
id = "G5.hook-stage-test"
phase = "G5.P2"
cmd = ["uv", "run", "--frozen", "python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-p", "no:randomly", "tests/test_pre_commit.py", "-k", "prek"]
expect = 0
expect_stdout = "passed"

[[check]]
id = "G5.ci-structure"
phase = "G5.P3"
# permissions contents:read, concurrency cancel-in-progress, timeout-minutes per job, the five jobs,
# persist-credentials false, setup-uv with cache, uv sync --locked, every guardrail via poe guardrails.
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-ci-structure"]
expect = 0

[[check]]
id = "G5.dependabot"
phase = "G5.P3"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-dependabot"]
expect = 0

[[check]]
id = "G5.generated-docs"
phase = "G5.P4"
# every generated doc regenerated by its own generator; each generator's --check exits 0
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-generated-docs"]
expect = 0

[[check]]
id = "G5.gate-still-green"
phase = "G5.P4"
cmd = ["uv", "run", "--frozen", "poe", "gate"]
expect = 0
timeout_s = 3600
