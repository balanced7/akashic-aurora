# G1 -- foundation: uv, dependencies, Python pin, launcher, task runner (class A).
# Registered in G0 (plan G0.P3). Append-only; see G0.toml header.
goal = "G1"
required_drills = ["D08", "D09"]

[[check]]
id = "G1.lock-check"
phase = "G1.P3"
cmd = ["uv", "lock", "--check"]
expect = 0

[[check]]
id = "G1.fresh-clone-sync"
phase = "G1.P3"
cmd = ["{python}", "tooling-upgrade/certify.py", "fresh-clone"]
expect = 0
timeout_s = 3600

[[check]]
id = "G1.deptry"
phase = "G1.P1"
cmd = ["uv", "run", "--frozen", "poe", "deps"]
expect = 0

[[check]]
id = "G1.python-version-file"
phase = "G1.P2"
cmd = ["git", "ls-files", "--error-unmatch", ".python-version"]
expect = 0

[[check]]
id = "G1.python-agrees"
phase = "G1.P2"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-python-agrees"]
expect = 0

[[check]]
id = "G1.no-bare-py"
phase = "G1.P5"
cmd = ["{python}", "tooling-upgrade/certify.py", "assert-no-bare-py"]
expect = 0

[[check]]
id = "G1.mcp-stdio"
phase = "G1.P5"
cmd = ["{python}", "tooling-upgrade/oracle.py", "mcp-stdio"]
expect = 0

[[check]]
id = "G1.poe-tasks-tamper"
phase = "G1.P6"
cmd = ["{python}", "tooling-upgrade/certify.py", "G1", "--tamper-only"]
expect = 0

[[check]]
id = "G1.pytest-ini-gone"
phase = "G1.P7"
cmd = ["git", "ls-files", "--error-unmatch", "pytest.ini"]
expect = 1

[[check]]
id = "G1.collection-identical"
phase = "G1.P7"
cmd = ["{python}", "tooling-upgrade/oracle.py", "compare", "g0", "head", "--components", "O1,O9"]
expect = 0

[[check]]
id = "G1.oracle"
phase = "G1.P7"
cmd = ["{python}", "tooling-upgrade/oracle.py", "compare", "g0", "head"]
expect = 0
expect_stdout = "^ORACLE: 10/10 EQUAL$"
