[tool.ruff.lint]
# Plan G3 target set, minus five families moved to the stretch ratchet by decision D-G3-1
# (PTH, BLE, T20, S, N: ~13k findings with no autofix, beyond the T4 suppression budget).
# Those five, with the plan's stretch set (D, ANN, ARG, FBT, TRY, PL), are counted in
# tooling-upgrade/ratchet.json and may never rise (certify.py assert-ratchet).
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "RUF", "T10", "ASYNC", "LOG", "G",
    "A", "PT", "RET", "TC", "ERA", "PGH", "FLY", "ISC", "ICN", "Q",
]
# E501: the formatter owns line length. ISC001, Q000-Q003, COM812: conflict with the formatter.
ignore = ["E501", "ISC001", "Q000", "Q001", "Q002", "Q003", "COM812"]
# The ratchet families' `# noqa` comments still matter to their counts: RUF100 keeps them.
external = ["PTH", "BLE", "T20", "S", "N"]
# Typographic characters used on purpose in docstrings, strings and comments (en dash, set union,
# multiplication sign, angle quote, sigma, apostrophe). RUF001-RUF003 still flag every other confusable.
allowed-confusables = ["–", "∪", "×", "›", "σ", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest asserts are the point
"scripts/**" = ["T20"]  # scripts print to their user by design

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
# The standard test runner for this repo:  uv run pytest   (Windows fallback without uv:
# py -m pytest). Collects both styles (pytest test_* functions AND the older banner-style
# files, whose test_* functions pytest discovers automatically). Moved from pytest.ini in G1.P7
# with the same meaning, plus --strict-markers and --strict-config.
testpaths = ["tests"]
# pytest-randomly is installed with the dev tools (G1) but stays off until the G5.P1
# experiment adopts it on evidence: -p no:randomly keeps today's file order and seeding.
addopts = ["-q", "-p", "no:randomly", "--strict-markers", "--strict-config"]
# A test that `return`s a value (instead of asserting) is almost always a mistake;
# make it an error so the convention stays clean going forward.
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]

[tool.coverage.run]
# Coverage is always on in `poe test` (plan G5.P1): branch coverage of the runtime and script
# packages, the same set O10 measures (tooling-upgrade/oracle.py COVERAGE_SOURCES).
branch = true
source = ["core", "agent", "arsenal", "scripts"]

[tool.coverage.report]
precision = 2

[tool.deptry]
# Scope (plan G1.P1): [project].dependencies must equal what RUNTIME and SCRIPT code imports.
# tests/ stays out (deptry's default exclude: test code imports dev tools). docs/ and research/
# are history trees: every ARCHIVAL file lives there, and their remaining scripts import retired
# stacks (torch, fastapi, selenium, flask, cv2, ...) that no deployment of this checkout ever
# installed (g0 O3: those modules already fail to import; every module outside them imports OK).
# aurora-cli/ is its own package (the `aurora` launcher) with its own [project].dependencies.
extend_exclude = ["^docs/", "^research/", "^aurora-cli/"]
# Sibling modules imported through a sys.path entry (scripts/, scripts/generators/,
# scripts/checkers/, scripts/githooks/, scripts/quiet/, core/toolbelt/, agent/harness/,
# tooling-upgrade/), which deptry cannot see as first-party.
known_first_party = [
    "_tracked", "ask_deepseek", "ask_gpt", "bifrost_runner_deepseek", "check_preregistration",
    "check_reconciliation_gate", "coauthor", "deepseek_chat", "gemini_chat", "gemini_web",
    "gen_arch_index", "gen_doors", "gen_library", "gen_master_map", "gen_physics_sheet",
    "gen_prior_art_register", "gen_report_scaffold", "hooks", "kimi_chat", "mirror", "oracle",
    "piano_roll_pack", "releases", "sitecustomize", "sol_chat", "toast", "vfx_ingest",
]

[tool.deptry.per_rule_ignores]
DEP001 = [
    "flvfx",     # provided by FL Studio's VFX Script host; guarded import (arsenal/fl/vfx)
    "bifrost",   # optional bifrost.api in scripts/bifrost_ui.py; guarded, answers 500 when absent
    "aurora_rs", # the optional Rust wheel (aurora-rs/py); core/foundation/accel.py falls back to Python
]
DEP002 = [
    "lupa",      # loaded by fakeredis to run the bus's Lua scripts (dynamic, never imported)
]
DEP004 = [
    # optional groups (ml, browser): imported lazily inside functions with a fallback or a
    # hint, so every module imports without them (g0 O3: all OK)
    "sentence_transformers", "deepmultilingualpunctuation",
    "playwright", "patchright", "playwright_stealth",
]

[tool.basedpyright]
# Plan G4.P1. One config home (T1): basedpyright always runs with `-p pyproject.toml`.
# Scope = the inventory's in-scope files (T2): everything, minus the same ARCHIVAL list as
# [tool.ruff] extend-exclude, plus pyright's own defaults (hidden dirs, caches).
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
