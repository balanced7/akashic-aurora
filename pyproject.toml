# Lets `uv run` resolve Aurora's dependencies with nothing installed beforehand:
#   uv run -p 3.12 agent_cli.py boot me --task "..."
# The same list lives in requirements.txt for `pip install -r requirements.txt` (the Windows
# `py` setup). Keep the two in step.
#
# Nothing here needs a separately installed service: the Bifrost bus runs on an embedded,
# SQLite-persisted Redis (core/foundation/embedded_redis.py) when no Redis server is present.
[project]
name = "akashic-aurora"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    # the store and the bus
    "redis>=5,<9",
    "fakeredis>=2.30",
    "lupa>=2",
    # fleet health
    "psutil>=5",
    # the MCP door (ai_setup_mcp.py)
    "mcp>=1,<2",          # ai_setup_mcp.py uses the 1.x FastMCP API (renamed in 2.x)
    "anyio>=4",
    # model runners and helper doors (DeepSeek / OpenAI-compatible, Gemini, Discord)
    "openai>=1,<3",       # 3.x double-wraps an httpx.Timeout passed as timeout= (runner_lib)
    "httpx>=0.27",
    "requests>=2.31",
    "google-genai>=1",
    "discord.py>=2.3",
    "pynacl>=1.5",
    # the web and manuals doors
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "pypdf>=4",
    "pymupdf>=1.24",
    "trafilatura>=1.8",
    # arsenal (media analysis), screen space, transcripts
    "numpy>=1.26",
    "av>=12",
    "pillow>=10",
    "mss>=9",
    "imageio-ffmpeg>=0.5",
    "zstandard>=0.22",
    # the console
    "rich>=13",
    "prompt_toolkit>=3",
    # Windows-only UI automation (core/screenspace); absent elsewhere by design
    "uiautomation>=2; sys_platform == 'win32'",
]

[dependency-groups]
# Semantic embeddings and punctuation restoration pull in PyTorch (gigabytes); both features are
# OFF by default and fall back to the deterministic pipeline. `uv sync --group ml` to enable.
ml = [
    "sentence-transformers>=3",
    "deepmultilingualpunctuation>=1.0",
]
# Browser automation for the Gemini web door; also needs `playwright install chromium`.
browser = [
    "playwright>=1.44",
    "patchright>=1.44",
    "playwright-stealth>=1.0",
]
# Development tools (plan G1.P1). `uv sync` installs this group by default ([tool.uv]
# default-groups), which matters: runtime code shells out to pytest (agent_cli.py
# suite-baseline, scripts/ship_gate.py, scripts/check_fresh_clone.py, core/comm/toolbox.py).
# prek replaces pre-commit as the hook-config runner.
dev = [
    "basedpyright>=1.40.1",
    "deptry>=0.25.1",
    "poethepoet>=0.48.0",
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv]
package = false
required-version = ">=0.12"
# Supply-chain cooldown: resolve only releases at least 7 days old.
exclude-newer = "7 days"
default-groups = ["dev"]

# Fallback (plan G1): these locked versions were younger than 7 days when the cooldown arrived
# (2026-10-01), and without an override uv would downgrade them. Each line admits releases up to
# that day for one package, so the lock the G0 oracle measured stays as it is. Delete each line
# on its date: the locked version is then old enough for the global setting alone.
[tool.uv.exclude-newer-package]
av = "2026-10-01T12:00:00Z"                    # keeps 19.0.0; remove on or after 2026-10-07
"charset-normalizer" = "2026-10-01T12:00:00Z"  # keeps 3.5.2; remove on or after 2026-10-08
coverage = "2026-10-01T12:00:00Z"              # keeps 7.16.2; remove on or after 2026-10-05
cryptography = "2026-10-01T12:00:00Z"          # keeps 50.0.2; remove on or after 2026-10-08
filelock = "2026-10-01T12:00:00Z"              # keeps 4.0.7; remove on or after 2026-10-07
"google-auth" = "2026-10-01T12:00:00Z"         # keeps 2.59.1; remove on or after 2026-10-08
prek = "2026-10-01T12:00:00Z"                  # keeps 0.5.4; remove on or after 2026-10-06
pyjwt = "2026-10-01T12:00:00Z"                 # keeps 2.15.1; remove on or after 2026-10-06
regex = "2026-10-01T12:00:00Z"                 # keeps 2026.9.29; remove on or after 2026-10-07
ruff = "2026-10-01T12:00:00Z"                  # keeps 0.16.9; remove on or after 2026-10-02
"sse-starlette" = "2026-10-01T12:00:00Z"       # keeps 3.5.0; remove on or after 2026-10-06
torch = "2026-10-01T12:00:00Z"                 # keeps 2.14.1; remove on or after 2026-10-08
transformers = "2026-10-01T12:00:00Z"          # keeps 5.18.0; remove on or after 2026-10-08
uvicorn = "2026-10-01T12:00:00Z"               # keeps 0.54.0; remove on or after 2026-10-03

[tool.deptry]
# Scope (plan G1.P1): [project].dependencies must equal what RUNTIME and SCRIPT code imports.
# tests/ stays out (deptry's default exclude: test code imports dev tools). docs/ and research/
# are history trees: every ARCHIVAL file lives there, and their remaining scripts import retired
# stacks (torch, fastapi, selenium, flask, cv2, ...) that no deployment of this checkout ever
# installed (g0 O3: those modules already fail to import; every module outside them imports OK).
extend_exclude = ["^docs/", "^research/"]
# Sibling modules imported through a sys.path entry (scripts/, scripts/generators/,
# scripts/checkers/, scripts/githooks/, scripts/quiet/, core/toolbelt/, agent/harness/,
# tooling-upgrade/), which deptry cannot see as first-party.
known_first_party = [
    "_tracked", "ask_deepseek", "ask_gpt", "bifrost_runner_deepseek", "check_preregistration",
    "check_reconciliation_gate", "coauthor", "deepseek_chat", "gemini_chat", "gemini_web",
    "gen_arch_index", "gen_doors", "gen_library", "gen_master_map", "gen_physics_sheet",
    "gen_prior_art_register", "gen_report_scaffold", "hooks", "kimi_chat", "mirror", "oracle",
    "piano_roll_pack", "sitecustomize", "sol_chat", "toast", "vfx_ingest",
]

[tool.deptry.per_rule_ignores]
DEP001 = [
    "flvfx",     # provided by FL Studio's VFX Script host; guarded import (arsenal/fl/vfx)
    "bifrost",   # optional bifrost.api in scripts/bifrost_ui.py; guarded, answers 500 when absent
]
DEP002 = [
    "lupa",      # loaded by fakeredis to run the bus's Lua scripts (dynamic, never imported)
]
DEP004 = [
    # optional groups (ml, browser): imported lazily inside functions with a fallback or a
    # hint, so every module imports without them (g0 O3: all OK)
    "sentence_transformers", "deepmultilingualpunctuation",
    "playwright", "patchright", "playwright_stealth",
]

[tool.poe.tasks.deps]
help = "Dependency truth: deptry over RUNTIME and SCRIPT code (config: [tool.deptry])"
cmd = "deptry . --config pyproject.toml"
