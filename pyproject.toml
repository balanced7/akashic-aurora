# ---- Task runner (plan G1.P6): `uv run poe <task>`; `uv run poe -d <task>` prints the command.
# Ruff and basedpyright always get their config explicitly (one config home: pyproject.toml).
# `gate` runs the tasks that can be green today, in plan order, and stops at the first failure.
# The others join it in the goal that makes them green (recorded in tooling-upgrade/checks/):
# fmt-check joined in G2; lint-check joined in G3, types joined in G4; ci-lint joins in G5.

[tool.poe.tasks.deps]
help = "Dependency truth: deptry over RUNTIME and SCRIPT code (config: [tool.deptry])"
cmd = "deptry . --config pyproject.toml"

[tool.poe.tasks.lock]
help = "Relock (uv lock), then regenerate the pip requirement files from the lock"
sequence = [
    { cmd = "uv lock" },
    { cmd = "python scripts/generators/gen_requirements.py" },
]

[tool.poe.tasks.lock-check]
help = "Fail if uv.lock is stale for pyproject.toml or a requirement file differs from the lock"
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "python scripts/generators/gen_requirements.py --check" },
]

[tool.poe.tasks.fmt]
help = "Format every in-scope file with ruff"
cmd = "ruff format --config pyproject.toml"

[tool.poe.tasks.fmt-check]
help = "Fail if any in-scope file is not ruff-formatted (changes nothing)"
cmd = "ruff format --check --config pyproject.toml"

[tool.poe.tasks.lint]
help = "Lint with ruff and apply its safe fixes"
cmd = "ruff check --fix --config pyproject.toml"

[tool.poe.tasks.lint-check]
help = "Fail on any ruff finding (changes nothing)"
cmd = "ruff check --config pyproject.toml"

[tool.poe.tasks.types]
help = "Type-check with basedpyright, then hold the suppression policy (T3 blanket/reason, T4 budget)"
sequence = [
    { cmd = "basedpyright -p pyproject.toml" },
    { cmd = "python tooling-upgrade/certify.py assert-suppressions" },
]

[tool.poe.tasks.types-ty]
help = "Type-check with ty (advisory second opinion)"
cmd = "ty check"



[tool.poe.tasks.ci-lint]
help = "Workflow lint: zizmor (workflows + dependabot.yml), actionlint (syntax), every uses: pinned to a SHA, least-privilege permissions"
sequence = [
    { cmd = "uvx zizmor@1.30.1 --offline .github" },
    { cmd = "uvx --from actionlint-py==1.7.12.25 actionlint" },
    { cmd = "python tooling-upgrade/certify.py assert-sha-pins" },
    { cmd = "python tooling-upgrade/certify.py assert-workflow-permissions" },
]

[tool.poe.tasks.guardrails]
help = "Every scripts/checkers/* with its documented arguments; none may exit worse than at g0"
cmd = "python tooling-upgrade/oracle.py guardrails"

[tool.poe.tasks.test]
help = "Full suite + branch coverage in a throwaway worktree (REDIS_DB=15), compared with g0: no stable-pass test may fail reproducibly, no package's coverage may drop > 0.5 pp (O10)"
sequence = [
    { cmd = "python tooling-upgrade/oracle.py snapshot suite --components O1,O10 --runs 1" },
    { cmd = "python tooling-upgrade/oracle.py compare g0 suite --components O1,O10" },
]

[tool.poe.tasks.test-fast]
help = "Smoke set + tests impacted by uncommitted changes (REDIS_DB=15), well under 3 minutes"
cmd = "python tooling-upgrade/oracle.py test-fast"

[tool.poe.tasks.cached-gate]
help = "`gate` through Turborepo (turbo.json): each member task runs in parallel and is cached on its inputs, so an unchanged tree replays in well under a second"
cmd = "npx --yes turbo@2.11.7 run gate --filter=aurora"

[tool.poe.tasks.cached-test]
help = "`test` through Turborepo: the full suite, cached on the whole tree; refuses to run on a dirty tree (clean-tree), since `test` measures HEAD"
cmd = "npx --yes turbo@2.11.7 run test --filter=aurora"

[tool.poe.tasks.clean-tree]
help = "Fail unless the working tree equals HEAD (no tracked edits, no untracked unignored files). `poe test` measures HEAD in a throwaway worktree, while Turborepo keys its cache on the working tree: this guard keeps the two the same, so a cached result is never replayed for untested edits"
expr = "not subprocess.run(['git', 'status', '--porcelain', '--untracked-files=all'], capture_output=True, text=True, check=True).stdout.strip()"
imports = ["subprocess"]
assert = true

[tool.poe.tasks.oracle]
help = "Full behavioural oracle: snapshot HEAD, then compare it with the g0 baseline"
sequence = [
    { cmd = "python tooling-upgrade/oracle.py snapshot head --runs 1" },
    { cmd = "python tooling-upgrade/oracle.py compare g0 head" },
]

[tool.poe.tasks.rust-gate]
help = "aurora-rs: fmt, clippy, tests, cargo-deny and a fuzz smoke, when aurora-rs/ changed and cargo exists (scripts/rust_gate.py)"
cmd = "python scripts/rust_gate.py"

[tool.poe.tasks.gate]
help = "The local gate: fmt-check, lint-check, types, lock-check, deps, guardrails, rust-gate, test-fast; stops at the first failure"
sequence = ["fmt-check", "lint-check", "types", "lock-check", "deps", "guardrails", "rust-gate", "test-fast"]
