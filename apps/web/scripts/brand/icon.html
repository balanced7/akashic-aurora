<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
      }
      body {
        width: 512px;
        height: 512px;
        background: transparent;
        display: grid;
        place-items: center;
      }
      .tile {
        width: 512px;
        height: 512px;
        border-radius: 112px;
        background: radial-gradient(80% 80% at 70% 15%, #0f3a3a, #030607 70%);
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 4px rgba(200, 170, 110, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <svg width="340" height="340" viewBox="0 0 32 32" fill="none">
        <defs>
          <linearGradient
            id="g"
            x1="4"
            y1="2"
            x2="28"
            y2="30"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#F0E6D2" />
            <stop offset=".45" stop-color="#C8AA6E" />
            <stop offset="1" stop-color="#785A28" />
          </linearGradient>
          <linearGradient
            id="c"
            x1="16"
            y1="8"
            x2="16"
            y2="24"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#B8FFF8" />
            <stop offset="1" stop-color="#0AC8B9" />
          </linearGradient>
        </defs>
        <path
          d="M16 1.5 29 9v14L16 30.5 3 23V9L16 1.5Z"
          stroke="url(#g)"
          stroke-width="1.8"
        />
        <path d="M16 7.5 23.5 12v8L16 24.5 8.5 20v-8L16 7.5Z" fill="url(#c)" />
        <path
          d="M16 7.5v17M8.5 12 23.5 20M23.5 12 8.5 20"
          stroke="#010A13"
          stroke-opacity=".35"
          stroke-width=".8"
        />
      </svg>
    </div>
  </body>
</html>
