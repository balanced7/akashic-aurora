<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
<title>System layout: usage, domain, foundation, backends</title>
<desc>Agents use SignalEmitter and CoordinatorService, which sit on domain objects (AgentSignalLedger, LearningStore, StoreReconciler), built on the two Pillar 0 primitives (Ledger and Store), which each run on Redis, File, or Hybrid backends.</desc>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#888780"/></marker>
</defs>
<text x="80" y="40" font-size="11.5" fill="#5F5E5A">how agents use it</text>
<text x="55" y="150" font-size="11.5" fill="#5F5E5A">domain — built on the foundation</text>
<text x="55" y="260" font-size="11.5" fill="#5F5E5A">foundation · Pillar 0 (the two boxes)</text>
<text x="95" y="376" font-size="11.5" fill="#5F5E5A">storage backends — shared, dual-write, fail-fast</text>
<path d="M192 108 L158 156" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M470 108 L238 156" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M160 222 L160 264" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M370 222 L405 264" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M560 222 L560 264" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M160 342 L165 380" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<path d="M465 342 L500 380" stroke="#888780" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="80" y="48" width="230" height="58" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="195" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">SignalEmitter</text>
<text x="195" y="93" text-anchor="middle" font-size="11.5" fill="#5F5E5A">agents announce what they do</text>
<rect x="370" y="48" width="240" height="58" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="490" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">CoordinatorService</text>
<text x="490" y="93" text-anchor="middle" font-size="11.5" fill="#5F5E5A">reacts: caches decisions, briefings</text>
<rect x="55" y="158" width="210" height="62" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="160" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">AgentSignalLedger</text>
<text x="160" y="203" text-anchor="middle" font-size="11.5" fill="#0F6E56">the signal firehose</text>
<rect x="285" y="158" width="170" height="62" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="370" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">LearningStore</text>
<text x="370" y="203" text-anchor="middle" font-size="11.5" fill="#0F6E56">experiment learnings</text>
<rect x="475" y="158" width="170" height="62" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="560" y="184" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">StoreReconciler</text>
<text x="560" y="203" text-anchor="middle" font-size="11.5" fill="#0F6E56">heals Redis vs File</text>
<rect x="55" y="268" width="210" height="72" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.6"/>
<text x="160" y="298" text-anchor="middle" font-size="17" font-weight="500" fill="#04342C">Ledger</text>
<text x="160" y="320" text-anchor="middle" font-size="12" fill="#0F6E56">what HAPPENED, in order</text>
<rect x="285" y="268" width="360" height="72" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.6"/>
<text x="465" y="298" text-anchor="middle" font-size="17" font-weight="500" fill="#04342C">Store</text>
<text x="465" y="320" text-anchor="middle" font-size="12" fill="#0F6E56">what IS true, by key</text>
<rect x="95" y="384" width="150" height="52" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="170" y="406" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Redis</text>
<text x="170" y="424" text-anchor="middle" font-size="11.5" fill="#5F5E5A">fast, shared</text>
<rect x="265" y="384" width="150" height="52" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="340" y="406" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">File</text>
<text x="340" y="424" text-anchor="middle" font-size="11.5" fill="#5F5E5A">always on disk</text>
<rect x="435" y="384" width="180" height="52" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.4"/>
<text x="525" y="406" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Hybrid</text>
<text x="525" y="424" text-anchor="middle" font-size="11.5" fill="#0F6E56">both — the default</text>
</svg>
