# prek (a pre-commit-compatible runner, in the dev group) runs these hooks: `uv run prek run --all-files`.
# Commits reach them through the repo's OWN hook framework -- scripts/githooks/pre_commit.py runs
# prek over the STAGED files as one stage of its backstop. Never `prek install`: it would fight
# core.hooksPath (scripts/githooks), which is how this repo installs its hooks.
#
# Every rev is a full commit SHA (resolved with `git ls-remote` at pin time) with its tag beside it.
# No whitespace or end-of-file fixers: they would rewrite non-Python trees (plan I8).

