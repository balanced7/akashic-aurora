repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # v0.16.9
    hooks:
      # Python only (plan I8): the hooks' default types include markdown, whose code blocks
      # ruff would reformat; the gate's ruff runs (poe fmt-check / lint-check) never see them.
      - id: ruff-check
        args: [--fix, --config=pyproject.toml]
        types_or: [python, pyi]
      - id: ruff-format
        args: [--config=pyproject.toml]
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 5403c16080c62d2568b9adab14249214641a9d1a  # 0.12.21
    hooks:
      - id: uv-lock
      # One uv-export per generated requirement file, with exactly the arguments
      # scripts/generators/gen_requirements.py uses, so `poe lock-check` agrees byte for byte.
      - id: uv-export
        name: uv-export (requirements.txt)
        args: [--frozen, --no-hashes, --no-emit-project, --no-annotate, --output-file, requirements.txt]
      - id: uv-export
        name: uv-export (requirements/gemini-web.txt)
        args: [--frozen, --no-hashes, --no-emit-project, --no-annotate, --only-group, browser, --output-file, requirements/gemini-web.txt]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc  # v1.7.12.25
    hooks:
      - id: actionlint
