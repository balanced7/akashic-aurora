[pytest]
# The standard test runner for this repo:  py -m pytest -q
# Collects both styles (pytest test_* functions AND the older banner-style files,
# whose test_* functions pytest discovers automatically).
testpaths = tests
# pytest-randomly is installed with the dev tools (G1) but stays off until the G5.P1
# experiment adopts it on evidence: -p no:randomly keeps today's file order and seeding.
addopts = -q -p no:randomly
# A test that `return`s a value (instead of asserting) is almost always a mistake;
# make it an error so the convention stays clean going forward.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
