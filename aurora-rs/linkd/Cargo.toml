[package]
name = "aurora-linkd"
description = "aurora-linkd: the fleet-link daemon (iroh transport, gossip, blobs, mailbox) behind a local JSON-RPC channel."
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true

[[bin]]
name = "aurora-linkd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aurora-link.workspace = true
iroh = "=1.3.0"
iroh-blobs = "=0.103.1"
iroh-gossip = "=0.101.0"
iroh-mdns-address-lookup = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
n0-future = "0.3.2"
