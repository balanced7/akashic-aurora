# Aurora's Rust workspace -- where a hot path moves when Python is measurably too slow.
#
# Layout follows openai/codex's codex-rs/: one Cargo workspace, small single-purpose crates,
# one shared version. Pure-Rust logic lives in its own crate (text/) with its own tests; the
# Python binding (py/) is a thin PyO3 layer that maturin builds into the akashic-aurora-rs
# wheel. Python always keeps a reference implementation and falls back to it (core/accel.py),
# so the Rust path is an accelerator, never a requirement. See aurora-rs/README.md.
[workspace]
members = ["text", "py", "link", "linkd"]
exclude = ["link/fuzz"]  # cargo-fuzz project; built with nightly
resolver = "2"

[workspace.package]
version = "0.1.0"  # the release version; scripts/release/releases.py keeps it in step
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/balanced7/akashic-aurora"
rust-version = "1.91"  # iroh 1.3's MSRV

[workspace.dependencies]
aurora-link = { path = "link" }
aurora-text = { path = "text" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[profile.release]
lto = "fat"
codegen-units = 1

# Crypto in tests (X-Wing key generation, 5200-round fingerprints) is slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

# The daemon aborts on panic and ManagedChild restarts it; the PyO3 module keeps unwinding so a
# panic there becomes a Python exception. Build the daemon with `--profile linkd`.
[profile.linkd]
inherits = "release"
panic = "abort"
