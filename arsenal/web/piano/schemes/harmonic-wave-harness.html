<!-- the same pinned three.js r186 import map as arsenal/web/piano-next.html -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <div>
    <div id="buttons"></div>
    <pre id="info">loading...</pre>
  </div>
</div>
<script type="module">
// A minimal stand-in for piano-next.js: same renderer settings, stage, key geometry, camera, bloom and
// scheme ctx/frame shapes, plus a stand-in chord label and staff in the protected band. It drives the
// scheme with synthetic note sequences through a notes engine that keeps the host's event guarantees.
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const params = new URLSearchParams(location.search);
const LAYOUT_MODE = params.get("layout") === "host" ? "host" : "spec";
const SCHEME_ID = params.get("scheme") || "harmonic-wave";

// ------------------------------------------------------------------ utility (as the host) --
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (c, target, tau, dt) => lerp(c, target, 1 - Math.exp(-dt / Math.max(tau, 1e-4)));
const T0 = performance.now() / 1000;
const clock = () => performance.now() / 1000 - T0;
const mod = (a, n) => ((a % n) + n) % n;

// ------------------------------------------------------------------ colour (pitch mode) --
function noteLch(midi) { return [0.76, 0.155, (200 + 30 * ((mod(midi, 12) * 7) % 12)) % 360]; }
function oklchToLinear(L, C, hDeg) {
  const h = (hDeg * Math.PI) / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [Math.max(0, 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
          Math.max(0, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
          Math.max(0, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)];
}
function noteColor(midi, vel, target = new THREE.Color()) { const [r, g, b] = oklchToLinear(...noteLch(midi, vel)); return target.setRGB(r, g, b); }
function noteCss(midi, vel, alpha = 1) { const [L, C, h] = noteLch(midi, vel); return `oklch(${L} ${C} ${h} / ${alpha})`; }

// ------------------------------------------------------------------ framing + key geometry --
const FRAMINGS = {
  "9:16": { id: "9:16", w: 1080, h: 1920, fov: 31, minSpan: 16, follow: true },
  "16:9": { id: "16:9", w: 1920, h: 1080, fov: 23, minSpan: 56, follow: false },
};
let framing = FRAMINGS[params.get("framing")] || FRAMINGS["9:16"];
const KEY = { first: 21, last: 108, whiteW: 0.94, whiteH: 0.8, whiteL: 6.2, blackW: 0.56, blackH: 0.64,
              blackL: 3.95, blackTop: 0.52, back: -3.1, pivotBack: 6.0 };
const WHITE_OFFSET = [0, -1, 1, -1, 2, 3, -1, 4, -1, 5, -1, 6];
const BLACK_CENTER = { 1: 0.9, 3: 2.1, 6: 3 + 4 / 7 * 1.5, 8: 5.0, 10: 3 + 4 / 7 * 5.5 };
const isBlack = (m) => BLACK_CENTER[mod(m, 12)] !== undefined;
function keyX(m) {
  const oct = Math.floor(m / 12), pc = mod(m, 12);
  const x = isBlack(m) ? oct * 7 + BLACK_CENTER[pc] : oct * 7 + WHITE_OFFSET[pc] + 0.5;
  return x - 38;
}
const RAIL_Y = 1.12, TRAIL_Z = -3.42;

// ------------------------------------------------------------------ scene (as the host) --
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: "high-performance" });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010206);
scene.fog = new THREE.Fog(0x010206, 95, 280);
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = (() => {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(80, 40, 80), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })));
  const strip = (w, h, intensity, tint, x, y, z, rx, ry) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); env.add(m);
  };
  strip(44, 3.2, 5.0, 0xffffff, 0, 15, 10, Math.PI / 2, 0);
  strip(3.2, 18, 2.6, 0xffe1c2, -30, 6, -6, 0, Math.PI / 2);
  strip(3.2, 18, 2.2, 0xc2d2ff, 30, 6, -12, 0, -Math.PI / 2);
  strip(36, 1.6, 1.4, 0x9fb4ff, 0, 3, -34, 0, 0);
  return pmrem.fromScene(env, 0.02).texture;
})();
const camera = new THREE.PerspectiveCamera(framing.fov, framing.w / framing.h, 0.5, 900);
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(framing.w, framing.h, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(framing.w, framing.h), 0.45, 0.0, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const STAGE_DARK = new THREE.Color(0x010206);
const stageTint = STAGE_DARK.clone();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: 0x020203, roughness: 0.62, metalness: 0.0 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.3; scene.add(floor);
const lacquer = new THREE.MeshPhysicalMaterial({ color: 0x050609, roughness: 0.24, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.04, envMap, envMapIntensity: 0.9 });
function addBox(w, h, d, r, x, y, z, material) { const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), material); mesh.position.set(x, y, z); scene.add(mesh); return mesh; }
addBox(56.4, 1.5, 8.3, 0.3, 0, -1.55, -1.45, lacquer);
addBox(1.5, 2.95, 9.5, 0.36, -27.1, -0.83, -1.0, lacquer);
addBox(1.5, 2.95, 9.5, 0.36, 27.1, -0.83, -1.0, lacquer);
addBox(52.7, 1.95, 2.35, 0.26, 0, 0.14, -4.46, lacquer);
const felt = new THREE.Mesh(new THREE.BoxGeometry(52.2, 0.16, 0.1), new THREE.MeshStandardMaterial({ color: 0x5c0c1a, roughness: 0.95 }));
felt.position.set(0, 0.08, -3.2); scene.add(felt);
const railLine = new THREE.Mesh(new THREE.BoxGeometry(52.2, 0.04, 0.04), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.9, 0.62, 0.3).multiplyScalar(0.9) }));
railLine.position.set(0, RAIL_Y - 0.06, -3.3); scene.add(railLine);
scene.add(new THREE.HemisphereLight(0x8a9cc8, 0x040404, 0.22));
const keyLight = new THREE.DirectionalLight(0xfff0dc, 1.9); keyLight.position.set(-16, 30, 24); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x9db6ff, 1.4); rimLight.position.set(12, 16, -30); scene.add(rimLight);
const noteLights = [0, 1, 2].map(() => { const light = new THREE.PointLight(0xffffff, 0, 9, 2); light.position.set(0, 2.1, -1.4); scene.add(light); return { light, level: 0, target: 0, color: new THREE.Color() }; });
let noteLightNext = 0;

const whiteGeo = new RoundedBoxGeometry(KEY.whiteW, KEY.whiteH, KEY.whiteL, 3, 0.07);
const blackGeo = new RoundedBoxGeometry(KEY.blackW, KEY.blackH, KEY.blackL, 3, 0.06);
const keys = new Map();
for (let m = KEY.first; m <= KEY.last; m++) {
  const black = isBlack(m);
  const material = black
    ? new THREE.MeshPhysicalMaterial({ color: 0x0a0a0d, roughness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.08, envMap, envMapIntensity: 0.8 })
    : new THREE.MeshPhysicalMaterial({ color: 0xdedbd3, roughness: 0.36, clearcoat: 0.5, clearcoatRoughness: 0.2, envMap, envMapIntensity: 0.35 });
  const len = black ? KEY.blackL : KEY.whiteL;
  const pivot = new THREE.Group();
  const pivotZ = KEY.back - KEY.pivotBack;
  pivot.position.set(keyX(m), 0, pivotZ);
  const mesh = new THREE.Mesh(black ? blackGeo : whiteGeo, material);
  mesh.position.set(0, black ? KEY.blackTop - KEY.blackH / 2 : -KEY.whiteH / 2, KEY.back + len / 2 - pivotZ);
  pivot.add(mesh); scene.add(pivot);
  keys.set(m, { m, black, pivot, material, lever: len + KEY.pivotBack, depth: 0, v: 0, target: 0, glow: 0, glowTarget: 0, color: new THREE.Color() });
}
function updateKeys(dt) {
  const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
  const h = dt / steps;
  for (const k of keys.values()) {
    const pressing = k.target > k.depth + 1e-4;
    const stiffness = pressing ? 4200 : 820, damping = pressing ? 118 : 36;
    for (let i = 0; i < steps; i++) { k.v += ((k.target - k.depth) * stiffness - k.v * damping) * h; k.depth += k.v * h; }
    if (Math.abs(k.depth) < 1e-5 && k.target === 0 && Math.abs(k.v) < 1e-4) { k.depth = 0; k.v = 0; }
    k.pivot.rotation.x = k.depth / k.lever;
    k.glow = damp(k.glow, k.glowTarget, k.glowTarget > k.glow ? 0.012 : 0.22, dt);
    k.material.emissive.copy(k.color).multiplyScalar(k.glow * (k.black ? 1.7 : 0.55));
  }
  for (const nl of noteLights) { nl.target *= Math.exp(-dt / 0.7); nl.level = damp(nl.level, nl.target, 0.03, dt); nl.light.intensity = nl.level; nl.light.color.copy(nl.color); }
}
function lightNote(m, vel) { const nl = noteLights[noteLightNext]; noteLightNext = (noteLightNext + 1) % 3; nl.light.position.x = keyX(m); noteColor(m, vel, nl.color); nl.target = 5 + 13 * (vel / 127); }

// ------------------------------------------------------------------ camera (as the host) --
const view = { top: 30, pointScale: 1000 };
const cam = { x: 0, span: framing.minSpan, recent: [] };
const lookTarget = new THREE.Vector3();
function hintCamera(m, t) { cam.recent.push({ x: keyX(m), t }); if (cam.recent.length > 96) cam.recent.shift(); }
function updateCamera(dt, t, snap = false) {
  let lo = Infinity, hi = -Infinity;
  for (const n of cam.recent) if (t - n.t < 6) { lo = Math.min(lo, n.x); hi = Math.max(hi, n.x); }
  let targetX = 0, targetSpan = 57;
  if (framing.follow) {
    targetSpan = lo <= hi ? clamp(hi - lo + 6, framing.minSpan, 57) : Math.max(cam.span, framing.minSpan);
    targetX = lo <= hi ? (lo + hi) / 2 : cam.x;
    targetX = clamp(targetX, -28.5 + targetSpan / 2, 28.5 - targetSpan / 2);
  }
  cam.x = snap ? targetX : damp(cam.x, targetX, 1.2, dt);
  cam.span = snap ? targetSpan : damp(cam.span, targetSpan, 1.6, dt);
  const vfov = THREE.MathUtils.degToRad(framing.fov);
  const tanH = Math.tan(vfov / 2) * (framing.w / framing.h);
  const dist = cam.span / 2 / tanH + 7;
  const elev = THREE.MathUtils.degToRad(framing.follow ? 22 : 17) + Math.sin(t * 0.13) * 0.012;
  const yaw = Math.sin(t * 0.071) * (framing.follow ? 0.06 : 0.035);
  lookTarget.set(cam.x, 0.4, -0.5);
  camera.position.set(lookTarget.x + dist * Math.sin(yaw) * Math.cos(elev), lookTarget.y + dist * Math.sin(elev), lookTarget.z + dist * Math.cos(yaw) * Math.cos(elev));
  camera.lookAt(lookTarget);
  const shift = framing.follow ? 0.25 : 0.29;
  camera.setViewOffset(framing.w, framing.h, 0, -shift * framing.h, framing.w, framing.h);
  view.top = RAIL_Y + dist * Math.tan(vfov / 2) * (1 + 2 * shift) * 0.98;
  view.pointScale = framing.h / (2 * Math.tan(vfov / 2));
}

// ------------------------------------------------------------------ stand-in overlay --
// Boxes in output pixels. "spec": the protected band of PIANO-V2-SPEC.md 6.3 (9:16 y 230-630, label
// left and staff right). 16:9 has no band in the spec, so it uses the host's LAYOUT boxes. "host": the
// boxes piano-next.js LAYOUT uses today (label cy 318, staff cy 800 in 9:16).
const BOXES = {
  spec: {
    "9:16": { label: { x: 20, y: 230, w: 520, h: 400 }, staff: { x: 540, y: 230, w: 520, h: 400, s: 17 }, band: [{ x: 0, y: 230, w: 1080, h: 400 }] },
    "16:9": { label: { x: 50, y: 41, w: 900, h: 310 }, staff: { x: 1240, y: 12, w: 640, h: 520, s: 20 } },
  },
  host: {
    "9:16": { label: { x: 10, y: 148, w: 1060, h: 340 }, staff: { x: 110, y: 500, w: 860, h: 600, s: 24 } },
    "16:9": { label: { x: 50, y: 41, w: 900, h: 310 }, staff: { x: 1240, y: 12, w: 640, h: 520, s: 20 } },
  },
};
const boxesFor = (id) => { const b = BOXES[LAYOUT_MODE][id]; return { ...b, band: b.band || [b.label, b.staff] }; };
const overlayScene = new THREE.Scene();
const overlayCam = new THREE.OrthographicCamera(0, framing.w, framing.h, 0, -10, 10);
const overlay = { layers: [] };
function makeLayer(box) {
  const c = document.createElement("canvas"); c.width = box.w; c.height = box.h;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false, toneMapped: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(box.w, box.h), mat);
  mesh.position.set(box.x + box.w / 2, framing.h - (box.y + box.h / 2), 0);
  overlayScene.add(mesh);
  return { c, ctx: c.getContext("2d"), tex, mat, mesh };
}
function plate(ctx, cx, cy, rx, ry, alpha) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(1,2,6,${alpha})`); g.addColorStop(0.55, `rgba(1,2,6,${alpha * 0.72})`); g.addColorStop(1, "rgba(1,2,6,0)");
  ctx.fillStyle = g; ctx.fillRect(-rx, -rx, 2 * rx, 2 * rx); ctx.restore();
}
const STAND_IN = { root: "C", suffix: "maj9", notes: [48, 64, 67, 71, 74] };
function drawLabelStandIn(layer, box) {
  const { ctx } = layer; const W = box.w, H = box.h;
  ctx.clearRect(0, 0, W, H);
  const S = Math.min(170, H * 0.42, W * 0.3);
  plate(ctx, W / 2, H * 0.5, W / 2, H / 2, 0.5);
  ctx.textBaseline = "alphabetic";
  ctx.font = `800 ${S}px Archivo, "Arial Narrow", sans-serif`;
  const rootW = ctx.measureText(STAND_IN.root).width;
  ctx.font = `600 ${Math.round(S * 0.54)}px Archivo, sans-serif`;
  const sufW = ctx.measureText(STAND_IN.suffix).width;
  const x0 = (W - rootW - sufW) / 2, base = H * 0.56;
  ctx.fillStyle = "rgba(244,241,234,1)";
  for (const pass of [0, 1]) {   // a glow pass, then a crisp pass, as the host's drawRuns does
    ctx.shadowColor = pass === 0 ? noteCss(48, 100, 0.55) : "transparent"; ctx.shadowBlur = pass === 0 ? 38 : 0;
    ctx.font = `800 ${S}px Archivo, "Arial Narrow", sans-serif`; ctx.fillText(STAND_IN.root, x0, base);
    ctx.font = `600 ${Math.round(S * 0.54)}px Archivo, sans-serif`; ctx.fillText(STAND_IN.suffix, x0 + rootW, base - S * 0.3);
  }
  ctx.shadowBlur = 0;
  const small = Math.round(S * 0.24);
  ctx.font = `700 ${small}px Archivo, sans-serif`;
  const names = ["C", "E", "G", "B", "D"];
  let x = W / 2 - (names.length * small * 1.1) / 2;
  names.forEach((n, i) => { ctx.fillStyle = noteCss(STAND_IN.notes[i], 110, 1); ctx.fillText(n, x, base + S * 0.52); x += small * 1.1; });
}
function drawStaffStandIn(layer, box) {
  const { ctx } = layer; const w = box.w, h = box.h, s = box.s;
  ctx.clearRect(0, 0, w, h);
  const feather = s * 1.1;
  ctx.save(); ctx.filter = `blur(${feather}px)`; ctx.fillStyle = "rgba(1,2,6,0.5)";
  ctx.beginPath(); ctx.roundRect(feather * 2.4, feather * 2.4, w - feather * 4.8, h - feather * 4.8, s); ctx.fill(); ctx.restore();
  const left = s * 3.2, right = w - s * 1.6;
  const trebleTop = h / 2 - s * 7.5, trebleBottom = trebleTop + 4 * s, bassTop = trebleBottom + 7 * s, bassBottom = bassTop + 4 * s;
  ctx.strokeStyle = "rgba(236,232,224,0.52)"; ctx.lineWidth = Math.max(1, s * 0.1); ctx.beginPath();
  for (const top of [trebleTop, bassTop]) for (let i = 0; i < 5; i++) { ctx.moveTo(left, top + i * s); ctx.lineTo(right, top + i * s); }
  ctx.stroke();
  ctx.lineWidth = Math.max(1.5, s * 0.16); ctx.beginPath(); ctx.moveTo(left, trebleTop); ctx.lineTo(left, bassBottom); ctx.moveTo(right, trebleTop); ctx.lineTo(right, bassBottom); ctx.stroke();
  ctx.fillStyle = "rgba(244,241,234,0.9)";
  ctx.font = `${4.4 * s}px "Noto Music", serif`; ctx.fillText("\u{1D11E}", left + s * 0.5, trebleTop + 3.1 * s);
  ctx.font = `${3.6 * s}px "Noto Music", serif`; ctx.fillText("\u{1D122}", left + s * 0.5, bassTop + 2.1 * s);
  // heads: C3 (bass), E4 G4 B4 D5 (treble); diatonic steps from the bottom line of each staff
  const noteX = left + (right - left) * 0.6, headW = s * 1.69;
  const heads = [[48, bassBottom - (21 - 18) * s / 2, false], [64, trebleBottom - (30 - 30) * s / 2, false], [67, trebleBottom - (32 - 30) * s / 2, false],
                 [71, trebleBottom - (34 - 30) * s / 2, true], [74, trebleBottom - (36 - 30) * s / 2, true]];
  layer.heads = [];
  for (const [m, y, hollow] of heads) {
    const col = noteCss(m, 110, 1);
    ctx.globalAlpha = hollow ? 0.6 : 1; ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, s * 0.13);
    ctx.shadowColor = noteCss(m, 110, 0.9); ctx.shadowBlur = s * 0.9;
    ctx.beginPath(); ctx.ellipse(noteX + headW / 2, y, headW / 2, s * 0.52, -0.35, 0, Math.PI * 2);
    if (hollow) ctx.stroke(); else ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  }

}
function buildOverlay() {
  for (const l of overlay.layers) { overlayScene.remove(l.mesh); l.mesh.geometry.dispose(); l.mat.dispose(); l.tex.dispose(); }
  const b = boxesFor(framing.id);
  const label = makeLayer(b.label), staff = makeLayer(b.staff);
  drawLabelStandIn(label, b.label); drawStaffStandIn(staff, b.staff);
  label.tex.needsUpdate = true; staff.tex.needsUpdate = true;
  overlay.layers = [label, staff];
  overlayCam.right = framing.w; overlayCam.top = framing.h; overlayCam.updateProjectionMatrix();
}

// ------------------------------------------------------------------ scheme host (ctx and frame per piano-next.js) --
const framingInfo = () => ({ id: framing.id, width: framing.w, height: framing.h });
const schemeCtx = Object.freeze({
  THREE, scene, camera, renderer, clock, keyX, isBlack, noteColor, noteCss,
  KEY: Object.freeze({ first: KEY.first, last: KEY.last }), RAIL_Y, TRAIL_Z,
  get framing() { return framingInfo(); },

const sounding = new Map();  // midi -> { held, vel, t0, inRange, releasedAt }
const schemeFrame = { info: null, sounding, pedalDown: false, framing: framingInfo(), view };
const host = { mod: null, inst: null, errors: [], counts: { noteOn: 0, noteRelease: 0, noteEnd: 0, pedal: 0 } };
function call(method, args) {
  if (!host.inst) return undefined;
  try { return host.inst[method](...args); }
  catch (e) { if (host.errors.length < 20) host.errors.push(`${method}: ${e && e.stack || e}`); console.error(e); return undefined; }
}
function emit(kind, ...args) { host.counts[kind]++; call(kind, args); }

// ------------------------------------------------------------------ notes engine (host semantics) --
let sustain = false;
function noteOn(m, vel) {
  if (vel <= 0) { noteOff(m); return; }
  const t = clock();
  const prev = sounding.get(m);
  if (prev && prev.inRange) emit("noteEnd", m, t);
  const inRange = m >= KEY.first && m <= KEY.last;
  sounding.set(m, { held: true, vel, t0: t, inRange, releasedAt: null });
  if (inRange) {
    emit("noteOn", m, vel, t);
    const k = keys.get(m); k.target = 0.17 + 0.27 * (vel / 127); k.glowTarget = 0.5 + 0.5 * (vel / 127); noteColor(m, vel, k.color);
    lightNote(m, vel); hintCamera(m, t);
  }
}
function noteOff(m) {
  const st = sounding.get(m);
  if (!st || !st.held) return;
  const t = clock();
  st.held = false;
  const k = keys.get(m);
  if (k) { k.target = 0; k.glowTarget = sustain ? 0.2 : 0; }
  if (!sustain) { if (st.inRange) emit("noteEnd", m, t); sounding.delete(m); }
  else { st.releasedAt = t; if (st.inRange) emit("noteRelease", m, t); }
}
function setSustain(on, value = on ? 127 : 0) {
  if (sustain === on) return;
  sustain = on;
  const t = clock();
  emit("pedal", on, value, t);
  if (!on) for (const [m, st] of sounding) {
    if (st.held) continue;
    if (st.inRange) emit("noteEnd", m, t);
    sounding.delete(m);
    const k = keys.get(m); if (k) k.glowTarget = 0;
  }
}
function allNotesOff() {
  const t = clock();
  for (const [m, st] of sounding) { if (st.inRange) emit("noteEnd", m, t); const k = keys.get(m); if (k) { k.target = 0; k.glowTarget = 0; } }
  sounding.clear();
  if (sustain) { sustain = false; emit("pedal", false, 0, t); }
}

// ------------------------------------------------------------------ sequences --
// [time s, "on", midi, vel] | [time, "off", midi] | [time, "pedal", bool]
function chord(at, notes, vel, len, roll = 0.02, ev = []) {
  notes.forEach((m, i) => { ev.push([at + i * roll, "on", m, Math.round(vel - 6 + 12 * (i / Math.max(1, notes.length - 1)))]); ev.push([at + len, "off", m]); });
  return ev;
}
const SEQUENCES = {
  silence: { duration: 3, marks: { rest: 1.5 }, events: [] },
  single: { duration: 5, marks: { held: 1.2, attack: 0.05 }, events: [[0, "on", 60, 96], [4.2, "off", 60]] },
  held: { duration: 7, marks: { held: 3 }, events: [[0, "on", 57, 84], [6.5, "off", 57]] },
  triad: { duration: 5, marks: { held: 1.2 }, events: chord(0, [60, 64, 67], 88, 4.2) },
  dense: { duration: 5, marks: { held: 1.2 }, events: chord(0, [36, 43, 52, 58, 62, 66, 69, 74], 92, 4.2, 0.025) },
  // Fmaj9 G9 Em7 Am9, rolled, with legato pedal changes (after the host demo)
  progression: (() => {
    const beat = 60 / 84, ev = [], marks = {};
    const bars = [{ n: "Fmaj9", bass: [41, 48], rh: [57, 60, 64, 67, 72] }, { n: "G9", bass: [43, 50], rh: [59, 62, 65, 69, 74] },
                  { n: "Em7", bass: [40, 47], rh: [55, 59, 62, 67, 71] }, { n: "Am9", bass: [45, 52], rh: [55, 60, 64, 71, 72] }];
    let at = 0;
    for (const bar of bars) {
      ev.push([at - 0.04, "pedal", false]);
      bar.bass.forEach((m, i) => { ev.push([at + i * 0.012, "on", m, 78 - i * 8]); ev.push([at + beat * 1.2, "off", m]); });
      ev.push([at + 0.09, "pedal", true]);
      bar.rh.forEach((m, i) => { ev.push([at + 0.06 + i * 0.05, "on", m, 60 + i * 6]); ev.push([at + beat * 1.1, "off", m]); });
      marks[bar.n] = at + beat * 1.5;
      at += 2 * beat;
    }
    ev.push([at + 0.3, "pedal", false]);
    return { duration: at + 1.2, marks, events: ev };
  })(),
  // four octaves of pedalled arpeggios, 35 notes under one pedal; a held landing chord, then the lift
  storm: (() => {
    const ev = [[0, "pedal", true]];
    const up = [36, 40, 43, 47, 50, 48, 52, 55, 59, 62, 60, 64, 67, 71, 74, 72, 76, 79, 83, 86];
    const down = [81, 79, 76, 72, 69, 67, 64, 60, 57, 55, 52, 48, 45, 43, 40];
    const notes = [...up, ...down];
    notes.forEach((m, i) => { const at = 0.1 + i * 0.115; ev.push([at, "on", m, 70 + ((i * 37) % 40)]); ev.push([at + 0.1, "off", m]); });
    const landing = 0.1 + notes.length * 0.115 + 0.1;   // 4.225
    [48, 55, 64, 71].forEach((m, i) => { ev.push([landing + i * 0.015, "on", m, 84]); ev.push([landing + 2.4, "off", m]); });
    ev.push([landing + 0.2, "pedal", false]);
    ev.push([landing + 0.75, "pedal", true]);
    ev.push([landing + 2.6, "pedal", false]);
    return { duration: landing + 3.2, marks: { mid: 3.2, lift: landing + 0.2, after: landing + 0.65, notes: notes.length }, events: ev };
  })(),
  // pedal lifts to silence: chord, keys up (pedal holds), lift, repeat
  lifts: (() => {
    const ev = [], marks = {};
    [[48, 55, 64, 67], [45, 57, 60, 64], [41, 53, 57, 60, 65]].forEach((notes, i) => {
      const at = i * 1.6;
      ev.push([at, "pedal", true]);
      chord(at + 0.05, notes, 86, 0.35, 0.02, ev);
      ev.push([at + 1.2, "pedal", false]);
      marks[`pedalled${i}`] = at + 0.9; marks[`lifted${i}`] = at + 1.45;
    });
    return { duration: 5.4, marks, events: ev };
  })(),
  // repeated strikes: one note, then a chord
  repeat: (() => {
    const ev = [], marks = {};
    for (let i = 0; i < 8; i++) { ev.push([i * 0.18, "on", 67, 60 + i * 8]); ev.push([i * 0.18 + 0.12, "off", 67]); }
    for (let i = 0; i < 4; i++) { chord(1.7 + i * 0.4, [57, 60, 64], 70 + i * 12, 0.3, 0.0, ev); }
    marks.note = 0.6; marks.chord = 2.5;
    return { duration: 3.6, marks, events: ev };
  })(),
  // velocity: the same triad soft, then loud
  dynamics: { duration: 4.6, marks: { soft: 1.3, loud: 3.3 }, events: [...chord(0, [60, 64, 67], 30, 1.8, 0), ...chord(2.0, [60, 64, 67], 120, 2.2, 0)] },
  // a chord change with a new bass, struck at once, then a note added mid-morph
  morph: { duration: 2.6, marks: { change: 1.0, added: 1.08 },
           events: [...chord(0, [48, 52, 55], 90, 1.0, 0), ...chord(1.0, [51, 56, 60, 63], 90, 1.3, 0), [1.08, "on", 67, 90], [2.3, "off", 67]] },
};
const run = { name: null, events: [], i: 0, t0: 0, duration: 0 };
function tickSequence(t) {
  while (run.i < run.events.length && run.t0 + run.events[run.i][0] <= t) {
    const [, type, a, b] = run.events[run.i++];
    if (type === "on") noteOn(a, b); else if (type === "off") noteOff(a); else if (type === "pedal") setSustain(a);
  }
}

// ------------------------------------------------------------------ framing --
function fitCanvas() {
  const maxH = window.innerHeight - 16, maxW = window.innerWidth - 260;
  const scale = Math.min(maxW / framing.w, maxH / framing.h);
  canvas.style.width = `${Math.floor(framing.w * scale)}px`;
  canvas.style.height = `${Math.floor(framing.h * scale)}px`;
}
function applyFraming(id) {
  framing = FRAMINGS[id] || FRAMINGS["9:16"];
  renderer.setSize(framing.w, framing.h, false);
  composer.setSize(framing.w, framing.h);
  camera.fov = framing.fov; camera.aspect = framing.w / framing.h;
  buildOverlay();
  schemeFrame.framing = framingInfo();
  call("resize", [framingInfo()]);
  updateCamera(0, clock(), true);
  fitCanvas();
}

// ------------------------------------------------------------------ loop --
let tintOn = params.get("tint") !== "0";
let schemeOn = true;
let lastT = clock(), fps = 0, fpsFrames = 0, fpsAt = clock();
const frameMs = [];
const frameHooks = [];
const glowMix = new THREE.Color(), tmpColor = new THREE.Color();
function renderFrame() {
  const t = clock();
  const dt = clamp(t - lastT, 0, 0.1);
  lastT = t;
  tickSequence(t);
  updateKeys(dt);
  updateCamera(dt, t);
  schemeFrame.pedalDown = sustain;
  if (host.inst && schemeOn) call("update", [dt, t, schemeFrame]);  // only the active scheme updates, as in the host
  let count = 0;
  glowMix.setRGB(0, 0, 0);
  for (const [m, st] of sounding) { glowMix.add(noteColor(m, st.vel, tmpColor)); count++; }
  if (count) glowMix.multiplyScalar(1 / count); else glowMix.setRGB(0.05, 0.08, 0.2);
  // the host's stage tint; ?tint=0 or setStageTint(false) holds the stage at STAGE_DARK to isolate the scheme
  tmpColor.copy(STAGE_DARK).lerp(glowMix, count && tintOn ? 0.03 * Math.min(1, count / 4) : 0);
  if (tintOn) stageTint.lerp(tmpColor, 1 - Math.exp(-dt / 0.6)); else stageTint.copy(STAGE_DARK);
  scene.background.copy(stageTint); scene.fog.color.copy(stageTint);
  composer.render(dt);
  renderer.autoClear = false;
  renderer.render(overlayScene, overlayCam);
  renderer.autoClear = true;
  frameMs.push(dt * 1000); if (frameMs.length > 240) frameMs.shift();
  fpsFrames++;
  if (t - fpsAt >= 0.5) { fps = fpsFrames / (t - fpsAt); fpsFrames = 0; fpsAt = t; }
  for (const hook of frameHooks) hook(t, dt);
  return t;
}
function loop() { requestAnimationFrame(loop); try { renderFrame(); } catch (e) { if (host.errors.length < 20) host.errors.push("frame: " + (e.stack || e)); } }

// ------------------------------------------------------------------ measurement --
const probe = document.createElement("canvas");
const probeCtx = probe.getContext("2d", { willReadFrequently: true });
function bandLuma() {
  renderFrame();
  probe.width = framing.w; probe.height = framing.h;
  probeCtx.drawImage(canvas, 0, 0);
  let sum = 0, n = 0;
  for (const r of boxesFor(framing.id).band) {
    const d = probeCtx.getImageData(r.x, r.y, r.w, r.h).data;
    for (let i = 0; i < d.length; i += 4) { sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; n++; }
  }
  return sum / n / 255;
}
function resample(line, n) {
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * (line.length - 1), i0 = Math.min(line.length - 2, Math.floor(x)), f = x - i0;
    out[i] = line[i0] + (line[i0 + 1] - line[i0]) * f;
  }
  return out;
}

window.__harness = {
  ready: false,
  sequences: () => Object.fromEntries(Object.entries(SEQUENCES).map(([k, v]) => [k, { duration: v.duration, marks: v.marks }])),
  play(name, framingId) {
    const seq = SEQUENCES[name];
    if (!seq) throw new Error(`no sequence ${name}`);
    if (framingId && framingId !== framing.id) applyFraming(framingId);
    allNotesOff();
    run.name = name; run.events = [...seq.events].sort((a, b) => a[0] - b[0]); run.i = 0; run.t0 = clock() + 0.1; run.duration = seq.duration;
    return { name, framing: framing.id, layout: LAYOUT_MODE, duration: seq.duration, marks: seq.marks };
  },
  seqTime: () => clock() - run.t0,
  at(tRel) { return new Promise((res) => { const tick = () => (clock() - run.t0 >= tRel ? res(clock() - run.t0) : requestAnimationFrame(tick)); tick(); }); },
  snapshot(type = "image/jpeg", quality = 0.9) { renderFrame(); return canvas.toDataURL(type, quality); },
  bandLuma,
  // mean luma of each band rectangle separately, plus the bottom 40 px strip of each, to locate a change
  bandLumaBoxes() {
    renderFrame();
    probe.width = framing.w; probe.height = framing.h;
    probeCtx.drawImage(canvas, 0, 0);
    const mean = (r) => { const d = probeCtx.getImageData(r.x, r.y, r.w, r.h).data; let s = 0; for (let i = 0; i < d.length; i += 4) s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; return +(s / (d.length / 4) / 255).toFixed(5); };
    return boxesFor(framing.id).band.map((r) => ({ box: r, luma: mean(r), bottom40: mean({ x: r.x, y: r.y + r.h - 40, w: r.w, h: 40 }) }));
  },
  setStageTint(on) { tintOn = !!on; return tintOn; },
  setSchemeActive(on) { schemeOn = !!on; call("setActive", [schemeOn]); return schemeOn; },
  stats() {
    const sorted = [...frameMs].sort((a, b) => a - b);
    return { fps: +fps.toFixed(1), frameMsP95: +(sorted[Math.floor(sorted.length * 0.95)] || 0).toFixed(2), framing: framing.id, layout: LAYOUT_MODE,
             sequence: run.name, seqTime: +(clock() - run.t0).toFixed(3), pedal: sustain,
             sounding: [...sounding.keys()].sort((a, b) => a - b), scheme: host.inst && host.inst.stats ? host.inst.stats() : null,
             render: { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles },
             memory: { ...renderer.info.memory }, sceneObjects: scene.children.length, events: { ...host.counts }, errors: [...host.errors] };
  },
  // the drawn centreline of the harmony strand against the exported sample function, in pixels
  verifyDrawn() {
    renderFrame();
    const ins = host.inst.inspect();
    let maxErr = 0;
    const x0 = -0.01 * ins.width, x1 = 1.01 * ins.width;
    for (let i = 0; i < ins.n; i++) {
      const u = i / (ins.n - 1);
      const expected = ins.centre - host.mod.sampleWave(ins.components, u, ins.scroll) * ins.gain * ins.half;
      maxErr = Math.max(maxErr, Math.abs(expected - ins.centreline[i]));
    }
    return { n: ins.n, components: ins.components.length, maxPxError: maxErr, centre: ins.centre, half: ins.half, gain: ins.gain, x0, x1 };
  },
  // play "morph" and record the drawn centreline every frame; report per-frame steps before and during the change
  traceMorph(framingId) {
    return new Promise((resolve) => {
      const info = this.play("morph", framingId);
      const rows = [];
      let prev = null;
      const hook = (t) => {
        const tr = t - run.t0;
        if (tr < 0.3) return;
        const ins = host.inst.inspect();
        const line = resample(ins.centreline, 513);
        if (prev) {
          let d = 0; for (let i = 0; i < line.length; i++) d = Math.max(d, Math.abs(line[i] - prev.line[i]));
          rows.push({ t: tr, dt: tr - prev.t, d });
        }
        prev = { t: tr, line };
        if (tr > 1.6) {
          frameHooks.splice(frameHooks.indexOf(hook), 1);
          const pick = (a, b) => rows.filter((r) => r.t >= a && r.t <= b);
          const summarize = (rs) => ({ frames: rs.length, maxStepPx: +Math.max(...rs.map((r) => r.d)).toFixed(2),
                                       maxRatePxPerS: +Math.max(...rs.map((r) => r.d / Math.max(r.dt, 1e-4))).toFixed(0),
                                       medianDtMs: +(rs.map((r) => r.dt).sort((x, y) => x - y)[rs.length >> 1] * 1000).toFixed(2) });
          const during = pick(1.0, 1.3);
          let maxJump = 0;  // largest rate (px/s) divided by its neighbours' mean rate: a spike stands alone
          const rate = (r) => r.d / Math.max(r.dt, 1e-4);
          for (let i = 1; i < during.length - 1; i++) {
            const nb = (rate(during[i - 1]) + rate(during[i + 1])) / 2;
            if (nb > 100) maxJump = Math.max(maxJump, rate(during[i]) / nb);
          }
          resolve({ ...info, steady: summarize(pick(0.4, 0.95)), morph: summarize(during), maxStepOverNeighbours: +maxJump.toFixed(2),
                    after: summarize(pick(1.35, 1.6)) });
        }
      };
      frameHooks.push(hook);
    });
  },
};

// ------------------------------------------------------------------ boot --
const buttons = document.getElementById("buttons");
for (const name of Object.keys(SEQUENCES)) {
  const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => window.__harness.play(name); buttons.append(b);
}
for (const id of Object.keys(FRAMINGS)) { const b = document.createElement("button"); b.textContent = id; b.onclick = () => applyFraming(id); buttons.append(b); }
const pedalBtn = document.createElement("button"); pedalBtn.textContent = "pedal"; pedalBtn.onclick = () => setSustain(!sustain); buttons.append(pedalBtn);
window.addEventListener("resize", fitCanvas);
setInterval(() => { document.getElementById("info").textContent = JSON.stringify(window.__harness.stats(), null, 1); }, 500);

(async () => {
  try {
    const mod = await import(`./${SCHEME_ID}.js`);
    host.mod = mod;
    host.inst = mod.default.create(schemeCtx);
    call("setActive", [false]);
    applyFraming(framing.id);
    call("setActive", [true]);
    await document.fonts.ready;
    buildOverlay();
    loop();
    window.__harness.ready = true;
  } catch (e) {
    host.errors.push("boot: " + (e.stack || e));
    document.getElementById("info").textContent = "boot failed: " + (e.stack || e);
  }
})();
</script>
</body>
