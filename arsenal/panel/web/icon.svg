  <circle cx="362" cy="176" r="30" fill="#f2555a"/>
  <rect x="112" y="256" width="288" height="44" rx="22" fill="#242b3a"/>
  <rect x="112" y="256" width="150" height="44" rx="22" fill="#6aa8ff"/>
  <rect x="112" y="336" width="288" height="44" rx="22" fill="#242b3a"/>
