version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock. After a bump, `uv run poe lock` regenerates
  # the pip requirement files, and `poe lock-check` (in the gate) fails until it has.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The SHA-pinned actions in .github/workflows (each with its tag in a comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # aurora-rs: iroh-gossip, iroh-blobs and other pre-1.0 crates break every few weeks, so the
  # same 7-day cooldown applies, and `cargo deny` in CI catches an advisory sooner than this.
  - package-ecosystem: "cargo"
    directory: "/aurora-rs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
