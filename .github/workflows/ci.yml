name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_SETUP: ${{ github.workspace }}
      REDIS_HOST: localhost
      REDIS_PORT: "16379"
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt numpy  # numpy = optional embedding subsystems; exercised in CI
      - name: Architecture boundary guardrail
        run: python scripts/check_boundaries.py
      - name: Doc-freshness guardrail
        run: python scripts/check_doc_freshness.py
      - name: Test suite
        run: python -m pytest -q
