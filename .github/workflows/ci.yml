name: CI

on:
  push:
  pull_request:

# Least privilege (G5.P3): every job only reads the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA, the tag it resolved from beside it
# (`git ls-remote` at pin time); Dependabot (.github/dependabot.yml) proposes the updates.
jobs:
  gate:
    name: Gate (poe gate) and guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_SETUP: ${{ github.workspace }}
      REDIS_HOST: localhost
      REDIS_PORT: "16379"
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # One launcher (plan G1.P5): the locked environment, then every step through `uv run`.
      # numpy (the embedding subsystems exercised here) is a locked runtime dependency.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # The local gate, the same command a contributor runs: fmt-check, lint-check, types,
      # lock-check, deps, guardrails, test-fast; it stops at the first failure.
      - name: Gate
        run: uv run poe gate
      # The comprehensibility immune system -- the unbypassable REMOTE gate: every push/PR is checked,
      # so drift can't reach the shared repo via any local path (mirror/git commit that skipped hooks).
      # See docs/library/design/20260701_the-comprehensibility-immune-system-desi_339b01.md.
      # Each guardrail runs through `poe guardrails`, which holds a checker to its exit code in the
      # g0 baseline (tooling-upgrade/snapshots/g0/O6.json): it may hold or improve, never get worse.
      - name: Architecture boundary guardrail
        run: uv run poe guardrails --only check_boundaries
      - name: Doc-freshness guardrail
        run: uv run poe guardrails --only check_doc_freshness
      - name: Comprehensibility guardrail (docs match code; no stale refs / case drift)
        run: uv run poe guardrails --only check_comprehensibility
      - name: Wiring guardrail (no built-but-unwired core module)
        run: uv run poe guardrails --only check_wiring
      - name: Door-parity guardrail (CLI<->MCP verb surface)
        run: uv run poe guardrails --only check_door_parity

  test:
    name: Test suite (poe test)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AI_SETUP: ${{ github.workspace }}
      REDIS_HOST: localhost
      REDIS_PORT: "16379"
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # The full suite (REDIS_DB=15) with branch coverage, compared with the g0 baseline:
      # no stable-pass test may fail reproducibly, and no package's coverage may drop > 0.5 pp.
      - name: Test suite
        run: uv run poe test

  ty:
    name: ty (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ty is the advisory second opinion beside basedpyright (G4.P4): reported, never blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: ty
        run: uv run poe types-ty

  windows-smoke:
    name: Windows smoke (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 30
    # Windows stays a supported platform (PF3). Non-blocking until a human promotes it.
    continue-on-error: true
    env:
      REDIS_DB: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Status command
        run: uv run python agent_cli.py status
      - name: Portability tests
        run: uv run python -m pytest -q tests/test_portability.py tests/test_no_console_windows.py

  ci-lint:
    name: Workflow lint (poe ci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # zizmor (workflow security), actionlint (syntax), and every uses: pinned to a SHA
      - name: Workflow lint
        run: uv run poe ci-lint

  install-smoke:
    name: Install smoke (${{ matrix.os }}, the aurora CLI from this commit)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      AKASHIC_WORLD: alpha
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      # The release path end to end, from local assets: bundle + launcher wheel -> the real
      # install script for the OS -> the advertised commands and a hook, from outside any
      # checkout (release.yml repeats this against the assets it is about to publish).
      - name: Build the bundle and the launcher wheel
        run: |
          rel="$RUNNER_TEMP/rel"
          v="$(uv run --no-project scripts/release/releases.py version)"
          uv run --no-project scripts/release/build_bundle.py --out "$rel" --version "$v"
          uv build --package akashic-aurora-cli --wheel --out-dir "$rel"
          echo "AURORA_V=$v" >> "$GITHUB_ENV"
          echo "AURORA_RELEASE_BASE=$rel" >> "$GITHUB_ENV"
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: sh aurora-cli/install/install.sh --version "$AURORA_V" --no-modify-path
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AURORA_VERSION = $env:AURORA_V
          $env:AURORA_NO_MODIFY_PATH = '1'
          ./aurora-cli/install/install.ps1
      - name: The advertised commands answer from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          bin="$(uv tool dir --bin)"
          if command -v cygpath >/dev/null 2>&1; then bin="$(cygpath -u "$bin")"; fi
          export PATH="$bin:$PATH"
          set -x
          aurora self version
          aurora discover | head -5
          aurora status
          aurora learn smoke --experiment ci_smoke_install --tried install --result ok --recommend keep
          aurora recall ci_smoke_install | grep -q ci_smoke_install
          aurora setup --yes --dry-run --harness claude
          aurora -c "from core.foundation.accel import status; print(status())"
      - name: Hooks fire through the installed launcher in an enrolled project
        working-directory: ${{ runner.temp }}
        run: |
          bin="$(uv tool dir --bin)"
          if command -v cygpath >/dev/null 2>&1; then bin="$(cygpath -u "$bin")"; fi
          export PATH="$bin:$PATH"
          mkdir -p proj && cd proj
          aurora hooks install --harness claude --scope user
          aurora hooks enroll
          aurora hooks status
          payload='{"session_id":"ci","cwd":"'"$PWD"'","hook_event_name":"UserPromptSubmit","prompt":"ci smoke install"}'
          out="$(printf '%s' "$payload" | aurora agent/harness/hooks/claude_userpromptsubmit.py)"
          echo "$out"
          echo "$out" | grep -q ci_smoke_install
          if [ "$RUNNER_OS" = "Windows" ]; then
            # the console-less twin the Windows hook registrations use: stdin/stdout must still flow
            out="$(printf '%s' "$payload" | auroraw agent/harness/hooks/claude_userpromptsubmit.py)"
            echo "$out"
            echo "$out" | grep -q ci_smoke_install
          fi

  rust:
    name: Rust (aurora-rs) test, clippy, fmt + parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      # rustup, cargo, clippy and rustfmt come preinstalled on GitHub's Ubuntu runners.
      - name: cargo test / clippy / fmt
        working-directory: aurora-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Rust output equals Python output (tests/test_accel_parity.py)
        run: |
          uv sync --locked
          uvx --from 'maturin>=1.9,<2' maturin build --release -m aurora-rs/py/Cargo.toml --out "$RUNNER_TEMP/whl"
          uv pip install "$RUNNER_TEMP"/whl/*.whl
          uv run --no-sync pytest -q -p no:randomly tests/test_accel_parity.py
          uv run --no-sync python aurora-rs/bench.py --lessons 500
