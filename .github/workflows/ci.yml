name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_SETUP: ${{ github.workspace }}
      REDIS_HOST: localhost
      REDIS_PORT: "16379"
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt numpy  # numpy = optional embedding subsystems; exercised in CI
      # The comprehensibility immune system -- the unbypassable REMOTE gate: every push/PR is checked,
      # so drift can't reach the shared repo via any local path (mirror/git commit that skipped hooks).
      # See docs/library/design/20260701_the-comprehensibility-immune-system-desi_339b01.md.
      - name: Architecture boundary guardrail
        run: python scripts/checkers/check_boundaries.py
      - name: Doc-freshness guardrail
        run: python scripts/checkers/check_doc_freshness.py
      - name: Comprehensibility guardrail (docs match code; no stale refs / case drift)
        run: python scripts/checkers/check_comprehensibility.py
      - name: Wiring guardrail (no built-but-unwired core module)
        run: python scripts/checkers/check_wiring.py
      - name: Door-parity guardrail (CLI<->MCP verb surface)
        run: python scripts/checkers/check_door_parity.py
      - name: Test suite
        run: python -m pytest -q

  web:
    # The JS workspace (bun): the website (apps/web) and its packages. The root package.json
    # scripts run each task through turbo, the same commands a contributor runs (CONTRIBUTING.md).
    # Actions are pinned to full commit SHAs, the tag beside each.
    name: Website (bun)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The site's env schema (apps/web/env.config.ts) validates at build time; the example's
      # placeholders are enough to build and test it.
      - name: Website env from the example
        run: cp apps/web/.env.example apps/web/.env.local
      - name: Format
        run: bun run format
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
